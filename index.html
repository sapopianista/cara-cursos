<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cara Cursos: plataforma de educação corporativa com cursos, trilhas de carreira e acompanhamento para o RH." />
    <meta name="theme-color" content="#0d0f18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cara Cursos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes do React montar (evita "flash" de tema errado).
      try {
        var t = localStorage.getItem('cara-cursos-tema');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>O Cara Cursos precisa de JavaScript habilitado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
